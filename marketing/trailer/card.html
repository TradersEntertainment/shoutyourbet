<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: local("Inter"), local("Inter Regular"); }
:root { --bg:#0b0e11; --up:#0ecb81; --down:#f6465d; --accent:#f0b90b; --muted:#8b94a3; --line:#232a35; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); color: #e6e8eb; font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
.grid { position: absolute; inset: -40px; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; opacity: .35; animation: pan 12s linear infinite; mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%); }
@keyframes pan { to { transform: translate(48px, 48px); } }
.chart { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; opacity: .5; }
.chart path { stroke-dasharray: 3000; stroke-dashoffset: 3000; animation: draw 4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.tape { position: absolute; top: 36px; left: 0; white-space: nowrap; font: 600 15px "JetBrains Mono", "DejaVu Sans Mono", monospace; color: var(--muted); animation: tape 30s linear infinite; }
.tape b { color: #e6e8eb; margin-right: 8px; } .tape .u { color: var(--up); } .tape .d { color: var(--down); }
.tape span { margin-right: 48px; }
@keyframes tape { to { transform: translateX(-50%); } }
.center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 80px; }
.line { font-size: 58px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; max-width: 1000px; }
.line .w { display: inline-block; opacity: 0; transform: translateY(18px); filter: blur(6px); animation: word .6s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes word { to { opacity: 1; transform: none; filter: none; } }
.hl { color: var(--accent); }
.logo { display: flex; align-items: center; gap: 22px; justify-content: center; opacity: 0; transform: scale(.9); animation: pop .7s cubic-bezier(.2,1.4,.4,1) .2s forwards; }
@keyframes pop { to { opacity: 1; transform: none; } }
.mark { width: 104px; height: 104px; border-radius: 26px; background: var(--accent); color: #1a1400; display: grid; place-items: center; font-weight: 900; font-size: 46px; letter-spacing: -0.05em; box-shadow: 0 0 80px rgba(240,185,11,.35); }
.word { font-size: 92px; font-weight: 900; letter-spacing: -0.045em; }
.word em { font-style: normal; color: var(--accent); }
.tag { margin-top: 28px; font-size: 30px; color: var(--muted); font-weight: 500; opacity: 0; animation: fade .6s ease 1.1s forwards; }
.tag b { color: #e6e8eb; }
.pills { margin-top: 34px; display: flex; gap: 14px; justify-content: center; opacity: 0; animation: fade .6s ease 1.6s forwards; }
.pill { padding: 12px 22px; border-radius: 12px; font-weight: 800; font-size: 24px; letter-spacing: .02em; }
.pill.l { background: var(--up); color: #032117; } .pill.s { background: var(--down); color: #fff; } .pill.r { background: #1f2530; color: #e6e8eb; border: 1px solid #2d3542; }
@keyframes fade { to { opacity: 1; } }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.outro .flash { animation: flash .5s ease-out forwards; }
@keyframes flash { 0% { opacity: .5; } 100% { opacity: 0; } }
</style></head>
<body>
<div class="grid"></div>
<svg class="chart" viewBox="0 0 1280 400" preserveAspectRatio="none"><path d="M0 330 L80 300 L140 320 L210 250 L260 270 L330 190 L390 230 L450 150 L520 200 L580 120 L640 170 L700 90 L760 260 L820 300 L880 210 L940 240 L1010 140 L1070 160 L1140 60 L1200 110 L1280 40" fill="none" stroke="#0ecb81" stroke-width="3"/></svg>
<div class="tape" id="tape"></div>
<div class="center" id="c"></div>
<div class="flash"></div>
<script>
const q = new URLSearchParams(location.search), lang = q.get("lang") || "en", kind = q.get("kind") || "intro";
const T = {
  en: { intro: 'In a world where <span class="hl">everyone</span> is a trading genius…', tag: 'No real money. <b>Just real chaos.</b>', pills: ['LONG', 'SHORT', 'REKT'] },
  tr: { intro: 'Herkesin <span class="hl">trading dehası</span> olduğu bir dünyada…', tag: 'Gerçek para yok. <b>Gerçek kaos var.</b>', pills: ['LONG', 'SHORT', 'REKT'] },
}[lang];
const ticks = [["BTC","98.041","+1.46%",1],["ETH","3.601","-0.33%",0],["SOL","210,33","+0.16%",1],["DOGE","0,3922","+3.22%",1],["NDX","20.979","-0.10%",0],["BIST","10.402","-0.93%",0],["GOLD","2.743","+1.60%",1],["XRP","2,4199","+0.83%",1]];
const one = ticks.map(([s,p,c,u]) => `<span><b>${s}</b>${p} <i class="${u?'u':'d'}">${c}</i></span>`).join("");
document.getElementById("tape").innerHTML = one + one + one + one;
const c = document.getElementById("c");
if (kind === "intro") {
  // word-by-word reveal, keeping inline markup
  const tmp = document.createElement("div"); tmp.innerHTML = T.intro;
  let i = 0; const out = document.createElement("div"); out.className = "line";
  for (const node of tmp.childNodes) {
    const words = node.textContent.split(/(\s+)/);
    for (const w of words) {
      if (!w.trim()) { out.append(w); continue; }
      const s = document.createElement("span"); s.className = "w" + (node.nodeType === 1 ? " hl" : ""); s.textContent = w;
      s.style.animationDelay = (0.25 + i++ * 0.28) + "s"; out.append(s);
    }
  }
  c.append(out);
} else {
  document.body.classList.add("outro");
  c.innerHTML = `<div><div class="logo"><div class="mark">SY</div><div class="word">Shout<em>Your</em>Bet</div></div>
    <div class="tag">${T.tag}</div>
    <div class="pills">${T.pills.map((p,i)=>`<span class="pill ${['l','s','r'][i]}">${p}</span>`).join("")}</div></div>`;
}
</script>
</body></html>
